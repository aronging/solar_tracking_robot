# MXET 345 solar tracker - default configuration. Units are in the key names.
# Do not edit: put robot-specific values in config/robot.toml (auto-loaded after this file).
# Further overrides: --config extra.toml or --set section.key=value.
# TOML has no null: a REQUIRED hardware key that is unknown is left commented out,
# and the real backend refuses to start until it is filled in. Never guess a channel.

[site]
name = "College Station"
lat_deg = 30.6280            # [Likely] Texas A&M campus; CHANGE if testing elsewhere
lon_deg = -96.3344           # east positive
declination_deg = 2.0        # [Likely] magnetic declination, east positive; look up at NOAA and record the source

[hardware]
backend = "real"             # "real" | "sim"
# PCA9685 address 0x40 and its 100 Hz frequency are fixed by lab/motor_servo_pwm.py;
# the mux (0x70 on the board I2C bus) is fixed by lab/sensor_module.py.
ina219_address = 0x41
imu_address = 0x28
# mux_channel_panel = ?      # REQUIRED for real hardware (INA219 mux channel, 0-7)
# mux_channel_imu = ?        # REQUIRED for real hardware (BNO055 mux channel, 0-7)
# servo_channel_pan = ?      # REQUIRED for real hardware (HAT channel, 0-15)
# servo_channel_tilt = ?     # REQUIRED for real hardware (HAT channel, 0-15)
overrange_mA = 380

[servo]
pan_sign = 1                 # verify at first power-up
tilt_sign = 1                # verify at first power-up
limit_deg = 85
slew_deg_per_s = 60
settle_s = 0.6
pulse_min_us = 500
pulse_max_us = 2500
center_us = 1500
deg_per_us = 0.09
calibration_file = "config/servo_cal.json"   # generated by analysis/fit_servo_cal.py; used if it exists

[drive]                      # wheels (lab PWM_Motor), coarse turn only. The two commented keys are REQUIRED for a real turn.
# left_motor_channels = [?, ?]    # [fwd, rv] PCA channels of the left wheel
# right_motor_channels = [?, ?]   # [fwd, rv] PCA channels of the right wheel
turn_sign = 1
left_sign = 1
right_sign = 1
max_duty = 0.5
min_turn_duty = 0.25

[panel]
n_samples_default = 8
zero_offset_mA = 0.0
min_signal_mA = 5.0
k_clear_mA = 0.0             # 0 = estimate from the first clear-sky acquire

[pointing]
az_offset_init_deg = 0.0
el_offset_init_deg = 0.0
min_elevation_deg = 10.0
park_pan_deg = 0.0
park_tilt_deg = 0.0
max_bootstrap_offset_deg = 40.0

[align]
target_heading_true_deg = 180.0
tol_deg = 2.0
hold_s = 1.0
max_turn_s = 40.0
loop_hz = 20
kp = 0.02
ki = 0.002
kd = 0.004
d_filter_tau_s = 0.15
integral_mode = "trapezoid"  # "euler" | "trapezoid" | "simpson"
imu_mag_cal_min = 3

[acquire]
n_coarse = 9
first_half_width_deg = 40.0
later_half_width_deg = 15.0
tol_deg = 1.5
max_evals = 24
n_passes = 2
samples_per_point = 8
lamp_half_width_deg = 60.0
lamp_reacquire_half_width_deg = 30.0
lamp_reacquire_drop_frac = 0.05   # spec said 0.10, but a 25 deg lamp move only drops Isc 9.4%

[track]
tick_s = 1.0
predict_update_s = 60
scan_interval_s = 720
scan_guard_s = 120
limit_replan_s = 300
fixed_check_interval_s = 900
fixed_check_duration_s = 10
fixed_panel_az_deg = 180.0
fixed_panel_tilt_from_horizontal_deg = 45.0

[refine]
spread_deg = 15.0            # allowed 10..20
n_points = 7                 # allowed 5..7
scan_order = "shuffled"      # "sweep" | "shuffled"
samples_per_point = 8
max_scan_s = 30
max_rms_frac = 0.03
max_drift_frac = 0.03
max_cond = 2.0e5             # spec guessed 1e4, but cond2(MtM) = 2.3e4 at 15 deg and 1.2e5 at 10 deg
max_sigma_deg = 3.0
offset_forget = 1.0

[cloud]
hold_enter_ratio = 0.70
hold_exit_ratio = 0.80
hold_enter_samples = 5
hold_exit_samples = 10
reacquire_after_hold_s = 300
assume_clear_start = true

[runtime]
watchdog_s = 10
wait_for_sun_max_s = 1800
log_dir = "logs"
