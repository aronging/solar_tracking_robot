# Copy to config/site_<name>.toml, fill in from the real wiring, and run with
#   python -m solar_tracker --config config/site_<name>.toml preflight
# Only the keys that differ from default.toml are needed.

[site]
name = "Test field"
lat_deg = 30.6280
lon_deg = -96.3344
declination_deg = 2.0        # NOAA magnetic field calculator for the site and date

[hardware]
mux_channel_panel = 0        # EXAMPLE VALUES - read the real ones from the wiring
mux_channel_imu = 1
servo_channel_pan = 14
servo_channel_tilt = 15

[servo]
pan_sign = 1
tilt_sign = 1
